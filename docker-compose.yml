#administrador de base de datos

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4
    restart: always
    depends_on:
      - db
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@administrador.com
      PGADMIN_DEFAULT_PASSWORD: admin

volumes:
  pgdata:
