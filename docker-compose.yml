services:

#base de datos
  db:
    image: postgres:15.3
    container_name: productos-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nest -d productos"] # Se simplificó para evitar fallos de lectura
      interval: 5s
      timeout: 5s
      retries: 10

